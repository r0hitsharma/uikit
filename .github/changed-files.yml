# `.node-version` is listed in more than one group on purpose: it selects the
# runtime every suite executes on, so a bump changes what lint and the test job
# actually run against even though no source file changes alongside it. Without
# it here, a runtime-only change matches no group and every suite skips.
lint:
  - packages/**
  - package.json
  - package-lock.json
  - .node-version
  - .github/workflows/ci.yml
  - .github/changed-files.yml
  - .github/scripts/**

agent_marketplace:
  - packages/agent-marketplace/**

demo_relay:
  - packages/uikit-preview/demo-relay/**
  - packages/mcp-relay/**
  - package.json
  - package-lock.json
  - .github/workflows/ci.yml
  - .github/workflows/deploy-relay.yml
  - .github/changed-files.yml

# Packages with vitest specs that the `demo_relay` group does not already cover,
# plus the runtime they execute on. `npm test` runs every workspace's suite, so a
# change confined to one of these still has to trigger the test job.
vitest:
  - .node-version
  - packages/design-system/**
  - packages/charting/**
  - packages/dashboard-kit/**
  - packages/http-client-core/**
  - packages/http-client-react/**
  - packages/http-client-msw/**
  - packages/router-kit/**
  - packages/uikit-cli/**
  - packages/webmcp/**

# Everything a rendered story can depend on: the packages whose `dist/` the
# stories bundle, the committed baselines, the lockfile, and the job's own
# wiring. Matching only starts the visual-snapshots job; which stories it then
# checks on a pull request is decided after the build by
# .github/scripts/scope-snapshots.ts, which maps the diff through the preview's
# story-deps graph and fails if a package the stories render is missing here.
# Push to main, manual dispatch and the merge queue run the full suite
# regardless (see ci.yml).
visual_snapshots:
  - packages/uikit-preview/**
  - '!packages/uikit-preview/demo-relay/**'
  - packages/design-system/**
  - packages/charting/**
  - packages/dashboard-kit/**
  - packages/mcp-connect/**
  - packages/webmcp/**
  - package-lock.json
  - .github/workflows/ci.yml
  - .github/changed-files.yml
  - .github/scripts/scope-snapshots.ts
  - .github/scripts/snapshot-scope.ts
  - .github/scripts/lockfile-affected.ts
  - .github/scripts/snapshot-scope.test.ts
